# Keeps every number on the profile live: pulls X, OpenRouter and GitHub data, re-renders, ships.
# Zero dependencies: just Node + the files in /cosmos. Commits only when something visible changed.
name: cosmos · live sync

on:
  schedule:
    - cron: "*/15 * * * *"    # every 15 minutes (GitHub's practical floor for a live profile)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cosmos/**", "README.md", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: cosmos-live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fetch live data
        run: node --version && node cosmos/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCG_LOGIN: ${{ github.repository_owner }}
      - name: Render & ship
        run: |
          git config user.name "scg-cosmos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp cosmos/stats.json /tmp/stats.json && cp cosmos/avatars.json /tmp/avatars.json
          for attempt in 1 2 3 4 5; do
            node cosmos/build.mjs
            git add -A cosmos README.md
            if git diff --cached --quiet; then echo "nothing visible changed"; exit 0; fi
            git commit -q -m "📡 live sync $(date -u '+%F %H:%M') UTC"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push raced, retrying ($attempt)"; sleep $((RANDOM % 8 + 3))
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/stats.json cosmos/stats.json
            node -e "const f=require('fs');const a=JSON.parse(f.readFileSync('cosmos/avatars.json'));a.owner=JSON.parse(f.readFileSync('/tmp/avatars.json')).owner;f.writeFileSync('cosmos/avatars.json',JSON.stringify(a))"
          done
          exit 1
